<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WORM GPT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">
        <button class="icon-btn" aria-label="قائمة">
            ☰
        </button>

        <div class="logo">WORM GPT</div>

        <button class="icon-btn" aria-label="بحث">
            ⌕
        </button>
    </header>

    <!-- Chat -->
    <main class="chat-area" id="chatArea">

        <!-- Empty state -->
        <div class="empty-state" id="emptyState">
            <div class="empty-logo">✦</div>
            <h1>كيف يمكنني مساعدتك؟</h1>
            <p>ابدأ محادثة جديدة مع WORM GPT</p>
        </div>

        <!-- Messages will be inserted here -->

    </main>

    <!-- Composer -->
    <footer class="composer-wrapper">
        <div class="composer">

            <button class="round-btn" id="attachBtn" title="إضافة">
                +
            </button>

            <button class="tool-btn" id="thinkBtn" title="التفكير">
                🧠
            </button>

            <button class="tool-btn" id="webBtn" title="بحث">
                🌐
            </button>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="رسالة أو اضغط للتحدث..."
            ></textarea>

            <button class="send-btn" id="sendBtn" title="إرسال">
                ➤
            </button>

        </div>
    </footer>

</div>

<script>
const chatArea = document.getElementById("chatArea");
const emptyState = document.getElementById("emptyState");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

let thinkingEnabled = false;

document.getElementById("thinkBtn").addEventListener("click", () => {
    thinkingEnabled = !thinkingEnabled;
    document.getElementById("thinkBtn").classList.toggle("active", thinkingEnabled);
});

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

sendBtn.addEventListener("click", sendMessage);

function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    emptyState.style.display = "none";

    addUserMessage(text);
    addAIPlaceholder();

    input.value = "";
    input.style.height = "auto";
}

function addUserMessage(text) {
    const message = document.createElement("div");
    message.className = "message-row user-row";

    message.innerHTML = `
        <div class="message user-message">
            ${escapeHtml(text).replace(/\n/g, "<br>")}
        </div>
    `;

    chatArea.appendChild(message);
    scrollToBottom();
}

function addAIPlaceholder() {

    const row = document.createElement("div");
    row.className = "message-row ai-row";
    row.id = "ai-placeholder";

    row.innerHTML = `
        <div class="ai-message">

            <div class="typing-bubble">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chatArea.appendChild(row);
    scrollToBottom();

    /*
       هنا لاحقًا اربط الـSSE من Backend.

       عند وصول reasoning:
       showThinking(row, reasoningText)

       وعند وصول answer:
       showAnswer(row, answerText)
    */
}

function showThinking(row, reasoningText) {

    const ai = row.querySelector(".ai-message");

    let thinking = ai.querySelector(".thinking");

    if (!thinking) {

        thinking = document.createElement("div");
        thinking.className = "thinking";

        thinking.innerHTML = `
            <button class="thinking-header">
                <span>🧠 التفكير</span>
                <span class="arrow">⌃</span>
            </button>

            <div class="thinking-content"></div>
        `;

        ai.prepend(thinking);

        thinking.querySelector(".thinking-header").onclick = () => {
            thinking.classList.toggle("open");
        };
    }

    thinking.querySelector(".thinking-content").textContent = reasoningText;
}

function showAnswer(row, answerText) {

    const ai = row.querySelector(".ai-message");

    const typing = ai.querySelector(".typing-bubble");

    if (typing) typing.remove();

    let answer = ai.querySelector(".answer");

    if (!answer) {
        answer = document.createElement("div");
        answer.className = "answer";
        ai.appendChild(answer);
    }

    answer.textContent = answerText;

    scrollToBottom();
}

function scrollToBottom() {
    setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 20);
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}
</script>

</body>
</html>
