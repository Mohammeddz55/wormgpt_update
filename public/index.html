<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORM GPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">المحادثات</h2>
                <button class="sidebar-close" id="sidebarClose">✕</button>
            </div>
            <div class="sidebar-search">
                <input type="text" placeholder="ابحث في جميع المحادثات..." id="sidebarSearchInput">
            </div>
            <div class="sidebar-chats" id="sidebarChats">
                <!-- المحادثات تظهر هنا -->
            </div>
        </aside>

        <!-- Overlay للهاتف -->
        <div class="overlay" id="overlay"></div>

        <!-- Main -->
        <main class="main-area">
            <!-- Topbar -->
            <header class="topbar">
                <button class="icon-btn" id="btnNewChat" title="محادثة جديدة">+</button>
                <h1 class="logo">WORM<span>GPT</span></h1>
                <div class="topbar-actions">
                    <button class="icon-btn" id="btnSearch" title="بحث">🔍</button>
                    <button class="icon-btn" id="btnMenu" title="القائمة">☰</button>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area" id="chatArea">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-logo">WORM<span>GPT</span></div>
                    <p>اكتب رسالتك وابدأ المحادثة</p>
                </div>
            </div>

            <!-- Composer -->
            <footer class="composer">
                <div class="composer-inner">
                    <button class="composer-btn" id="btnAdd" title="إضافة">+</button>
                    <button class="composer-btn" id="btnThink" title="تفكير عميق">🧠</button>
                    <button class="composer-btn" id="btnWebSearch" title="بحث ويب">🌐</button>
                    <textarea id="messageInput" rows="1" placeholder="رسالة أو اضغط للتحدث..."></textarea>
                    <button class="composer-btn" id="btnMic" title="ميكروفون">🎤</button>
                    <button class="send-btn" id="btnSend" title="إرسال">➤</button>
                    <button class="stop-btn hidden" id="btnStop" title="إيقاف">■</button>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
