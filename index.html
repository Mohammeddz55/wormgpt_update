<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT - Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- الشريط العلوي -->
        <header class="topbar">
            <button class="icon-btn" id="btnNewChat" title="محادثة جديدة">+</button>
            <h1 class="logo">WORM<span>GPT</span></h1>
            <button class="icon-btn" id="btnMenu" title="القائمة">☰</button>
        </header>

        <!-- منطقة المحادثة -->
        <main class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <h2>أهلاً بك في WormGPT</h2>
                <p>اكتب رسالتك وابدأ المحادثة</p>
            </div>
        </main>

        <!-- شريط الإدخال -->
        <footer class="input-bar">
            <button class="tool-btn" id="btnThink" title="تفكير">🧠</button>
            <button class="tool-btn" id="btnSearch" title="بحث">🌐</button>
            <textarea id="messageInput" rows="1" placeholder="اكتب رسالتك..."></textarea>
            <button class="send-btn" id="btnSend" title="إرسال">➤</button>
            <button class="stop-btn hidden" id="btnStop" title="إيقاف">■</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
